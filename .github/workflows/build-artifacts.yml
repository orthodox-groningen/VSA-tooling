name: Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build generated artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test
        run: |
          python -m pytest

      - name: Validate content
        run: |
          vsa validate examples/hugo-demo/content-source

      - name: Generate Markdown and SVG
        run: |
          vsa build-markdown             examples/hugo-demo/content-source             generated/hugo/content             examples/hugo-demo/static/vsa

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo site
        run: |
          hugo             --source examples/hugo-demo             --contentDir ../../generated/hugo/content             --destination ../../generated/site

      - name: Upload generated Markdown
        uses: actions/upload-artifact@v4
        with:
          name: generated-markdown
          path: generated/hugo/content

      - name: Upload generated SVG
        uses: actions/upload-artifact@v4
        with:
          name: generated-svg
          path: examples/hugo-demo/static/vsa

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: generated/site
