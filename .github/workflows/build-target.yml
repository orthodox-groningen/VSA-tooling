name: Build target

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build-target:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build preview
        if: ${{ inputs.target == 'preview' }}
        run: |
          vsa validate examples/hugo-demo/content-source
          vsa build-markdown             examples/hugo-demo/content-source             generated/preview/content             examples/hugo-demo/static/vsa
          hugo             --source examples/hugo-demo             --contentDir ../../generated/preview/content             --destination ../../generated/preview/site

      - name: Build production candidate
        if: ${{ inputs.target == 'production' }}
        run: |
          vsa validate examples/hugo-demo/content-source
          vsa build-markdown             examples/hugo-demo/content-source             generated/production/content             examples/hugo-demo/static/vsa             --max-line-width 900
          hugo             --source examples/hugo-demo             --contentDir ../../generated/production/content             --destination ../../generated/production/site             --minify

      - name: Upload preview artifact
        if: ${{ inputs.target == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: generated/preview/site

      - name: Upload production artifact
        if: ${{ inputs.target == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: generated/production/site
