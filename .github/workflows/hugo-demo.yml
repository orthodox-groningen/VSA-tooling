name: Hugo demo build

on:
  push:
  pull_request:

jobs:
  hugo-demo:
    name: Build Hugo demo site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-groningen/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: |
          python -m pytest

      - name: Sync zondag bronbestanden
        run: python scripts/sync_bron_zondagen.py --bron-root vendor/bron

      - name: Validate VSA demo content
        run: |
          vsa validate examples/hugo-demo/content-source

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Generate Hugo content and SVG
        run: |
          vsa build-markdown             examples/hugo-demo/content-source             generated/hugo/content             examples/hugo-demo/static/vsa

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo demo
        run: |
          hugo             --source examples/hugo-demo             --contentDir ../../generated/hugo/content             --destination ../../generated/site

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: hugo-demo-site
          path: generated/site
