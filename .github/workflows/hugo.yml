name: Hugo + VSA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          pytest

      - name: Validate VSA content
        run: |
          vsa validate examples/hugo-demo/content-source

      - name: Generate Markdown + SVG
        run: |
          vsa build-markdown             examples/hugo-demo/content-source             generated/hugo/content             generated/hugo/static/vsa

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo
        run: |
          hugo             --source examples/hugo-demo             --contentDir ../../generated/hugo/content             --destination ../../generated/site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: generated/site
