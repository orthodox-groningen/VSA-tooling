name: Hugo legacy workflow

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest

    steps:
      - name: Notice
        run: |
          echo "This legacy workflow is disabled by default."
          echo "Use hugo-demo.yml for the active Hugo demo build."









      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

