# Eenmalig of handmatig: zet GitHub Pages-bron op branch gh-pages (/).
# Nodig wanneer Pages per ongeluk op "GitHub Actions" staat terwijl peaceiris
# naar gh-pages pusht — dan faalt de ingebouwde "pages build and deployment"-run.

name: Configure GitHub Pages (legacy gh-pages)

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  configure:
    name: Set Pages source to gh-pages branch
    runs-on: ubuntu-latest

    steps:
      - name: Configure legacy Pages source
        run: |
          http_code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/pages-response.json
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Pages-bron kon niet worden gezet (HTTP ${http_code})."
            exit 1
          fi
          echo "Pages-bron ingesteld op branch gh-pages (/)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
