name: Deploy Hugo demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build production site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-groningen/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install TEv2 tooling
        run: npm ci

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Run tests
        run: python -m pytest

      - name: Sync zondag bronbestanden
        run: python scripts/sync_bron_zondagen.py --bron-root vendor/bron

      - name: Validate VSA content
        run: vsa validate --summary examples/hugo-demo/content-source

      - name: Clean generated static VSA assets
        run: rm -rf examples/hugo-demo/static/vsa

      - name: Generate Hugo content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/hugo/content \
            examples/hugo-demo/static/vsa \
            --output-mode shortcode

      - name: Generate MXL for Coria links
        run: |
          vsa musicxml \
            examples/hugo-demo/content-source \
            examples/hugo-demo/static/vsa/mxl

      - name: Generate TEv2 terminology
        run: python scripts/tev2_hugo.py --content-root generated/hugo/content

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo production site
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/hugo/content \
            --destination ../../generated/site \
            --baseURL "https://orthodox-groningen.github.io/VSA-tooling/"

      - name: Upload production site
        uses: actions/upload-artifact@v4
        with:
          name: pages-production-site
          path: generated/site
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: build
    uses: ./.github/workflows/pages-deploy-reusable.yml
    with:
      artifact_name: pages-production-site
      publish_dir: site
      url_prefix: /VSA-tooling/
      pages_url: https://orthodox-groningen.github.io/VSA-tooling/
    permissions:
      contents: write
