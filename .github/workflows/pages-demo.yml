name: Deploy Hugo demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  production:
    name: Build and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate VSA content
        run: vsa validate examples/hugo-demo/content-source

      - name: Clean generated static VSA assets
        run: rm -rf examples/hugo-demo/static/vsa

      - name: Generate Hugo content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/hugo/content \
            examples/hugo-demo/static/vsa \
            --output-mode shortcode

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo production site
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/hugo/content \
            --destination ../../generated/site \
            --baseURL "https://orthodox-groningen.github.io/"

      - name: Deploy production root
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: generated/site
          keep_files: true
