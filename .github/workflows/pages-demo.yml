name: Deploy Hugo demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Validate VSA content
        run: |
          vsa validate examples/hugo-demo/content-source

      - name: Generate Hugo content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/hugo/content \
            examples/hugo-demo/static/vsa

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo site
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/hugo/content \
            --destination ../../generated/site \
            --baseURL "${{ github.server_url }}/${{ github.repository }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated/site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
