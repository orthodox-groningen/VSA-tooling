# Reusable Pages deploy — alleen via workflow_call (niet handmatig starten).
# Doel: publicatiecheck + peaceiris-push naar gh-pages. Gebruikt door docs-pages
# (VSA-tooling) en bron (docs-pages.yml). Pages-instelling: branch gh-pages, /.
# Zie .github/workflows/README.md en docs/guides/reuse-vsa-tooling.md

name: Reusable GitHub Pages deploy

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Artifact name from upload-artifact in the caller build job"
        required: true
        type: string
      publish_dir:
        description: "Directory with built site files (download path for the artifact)"
        required: false
        default: site
        type: string
      destination_dir:
        description: "Subdirectory on gh-pages (leeg = repository root)"
        required: false
        default: ""
        type: string
      url_prefix:
        description: "Public URL path prefix for publication check, e.g. /VSA-tooling/preview/"
        required: true
        type: string
      keep_files:
        description: >-
          peaceiris keep_files for subdirectory deploys (e.g. /preview/).
          Root deploys always wipe gh-pages and re-attach existing preview/ first.
        required: false
        default: false
        type: boolean
      skip_publication_check:
        description: "Skip scripts/check-publication-output.py (only if caller already checked)"
        required: false
        default: false
        type: boolean
      pages_url:
        description: "Optional URL echoed after deploy"
        required: false
        default: ""
        type: string
      vsa_tooling_ref:
        description: "VSA-tooling git ref for check-publication-output.py"
        required: false
        default: main
        type: string
      concurrency_group:
        description: "Concurrency group suffix (scoped per repository)"
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

# Eén groep per caller-repo: serialiseert peaceiris-writes naar gh-pages.
# cancel-in-progress: true — nieuwere deploys annuleren vastgelopen/queued runs
# (anders stapelen jobs tot 15–30 min “waiting for a runner”).
concurrency:
  group: pages-${{ github.repository }}-${{ inputs.concurrency_group }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Check and deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.publish_dir }}

      # Bij call vanuit VSA-tooling: zelfde SHA als de build (niet @main), anders
      # faalt de check op feature branches met nieuwere check-publication-output.py.
      - name: Checkout VSA-tooling (publication check)
        if: ${{ !inputs.skip_publication_check }}
        uses: actions/checkout@v4
        with:
          repository: orthodox-groningen/VSA-tooling
          path: vendor/vsa-tooling
          ref: ${{ github.repository == 'orthodox-groningen/VSA-tooling' && github.sha || inputs.vsa_tooling_ref }}

      - name: Check publication output
        if: ${{ !inputs.skip_publication_check }}
        run: |
          python vendor/vsa-tooling/scripts/check-publication-output.py \
            --site-dir "${{ inputs.publish_dir }}" \
            --url-prefix "${{ inputs.url_prefix }}"

      # Productie (root) en preview delen gh-pages. peaceiris heeft geen
      # "wis alles behalve X"; daarom: bestaande preview/ meenemen in publish_dir
      # en daarna keep_files=false (schone root, geen wezen zoals oude indexen).
      - name: Carry forward preview/ from current gh-pages
        if: inputs.destination_dir == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="${{ inputs.publish_dir }}/preview"
          tmp=_gh_pages_snap
          rm -rf "$tmp"
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$tmp"; then
            if [ -d "$tmp/preview" ]; then
              rm -rf "$dest"
              cp -a "$tmp/preview" "$dest"
              echo "Carried forward preview/ from current gh-pages"
            else
              echo "No preview/ on gh-pages yet"
            fi
            rm -rf "$tmp"
          else
            echo "No gh-pages branch yet (or clone failed); skipping preview carry-forward"
          fi

      - name: Deploy to GitHub Pages (subdirectory)
        if: inputs.destination_dir != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ inputs.publish_dir }}
          destination_dir: ${{ inputs.destination_dir }}
          keep_files: ${{ inputs.keep_files }}

      - name: Deploy to GitHub Pages (root)
        if: inputs.destination_dir == ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ inputs.publish_dir }}
          keep_files: false

      - name: Show site URL
        if: inputs.pages_url != ''
        run: |
          echo "Site URL: ${{ inputs.pages_url }}"
          echo "::notice::Pages-bron moet 'Deploy from a branch' zijn (gh-pages, /). Staat die op GitHub Actions, dan faalt de ingebouwde workflow 'pages build and deployment' na elke peaceiris-push."
