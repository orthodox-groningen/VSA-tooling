# Preview deploy — bij elke push (alle branches) naar gh-pages:/preview/.
# Doel: controleren of de branch deployable is op de gedeelde preview-URL.
# URL: https://orthodox-groningen.github.io/VSA-tooling/preview/
# Geen pytest (zie vsa-ci + site-build). Deploy via pages-deploy-reusable.yml.

name: Deploy preview to GitHub Pages

on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build preview site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-groningen/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install TEv2 tooling
        run: npm ci

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Sync zondag bronbestanden
        run: python scripts/sync_bron_zondagen.py --bron-root vendor/bron

      - name: Validate VSA content
        run: vsa validate --summary examples/hugo-demo/content-source

      - name: Clean generated static VSA assets
        run: rm -rf examples/hugo-demo/static/vsa

      - name: Generate Hugo preview content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/preview/content \
            examples/hugo-demo/static/vsa \
            --output-mode shortcode

      - name: Generate MXL for Coria links
        run: |
          vsa musicxml \
            examples/hugo-demo/content-source \
            examples/hugo-demo/static/vsa/mxl

      - name: Update navigation placeholders
        run: python scripts/update-nav-placeholders.py generated/preview/content

      - name: Generate TEv2 terminology
        run: python scripts/tev2_hugo.py --content-root generated/preview/content --url-prefix /VSA-tooling/preview/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo preview
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/preview/content \
            --destination ../../generated/preview/site \
            --baseURL "https://orthodox-groningen.github.io/VSA-tooling/preview/"

      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-site
          path: generated/preview/site
          if-no-files-found: error

  deploy:
    name: Deploy preview
    needs: build
    uses: ./.github/workflows/pages-deploy-reusable.yml
    with:
      artifact_name: pages-preview-site
      publish_dir: site
      destination_dir: preview
      url_prefix: /VSA-tooling/preview/
      pages_url: https://orthodox-groningen.github.io/VSA-tooling/preview/
    permissions:
      contents: write
