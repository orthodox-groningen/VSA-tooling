name: Deploy preview to GitHub Pages

on:
  push:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate VSA content
        run: vsa validate examples/hugo-demo/content-source

      - name: Clean generated static VSA assets
        run: rm -rf examples/hugo-demo/static/vsa

      - name: Generate Hugo preview content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/preview/content \
            examples/hugo-demo/static/vsa \
            --output-mode shortcode

      - name: Generate MXL for Coria links
        run: |
          vsa musicxml \
            examples/hugo-demo/content-source \
            examples/hugo-demo/static/vsa/mxl

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo preview
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/preview/content \
            --destination ../../generated/preview/site \
            --baseURL "https://orthodox-groningen.github.io/VSA-tooling/preview/"

      - name: Check publication output
        run: |
          python scripts/check-publication-output.py \
            --site-dir generated/preview/site \
            --url-prefix /VSA-tooling/preview/

      - name: Deploy preview directory
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: generated/preview/site
          destination_dir: preview
          keep_files: true

      - name: Show preview URL
        run: |
          echo "Preview URL: https://orthodox-groningen.github.io/VSA-tooling/preview/"
