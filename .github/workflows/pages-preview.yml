name: Deploy preview to GitHub Pages

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vsa-tooling
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-groningen/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Run tests
        run: python -m pytest

      - name: Sync zondag bronbestanden
        run: python scripts/sync_bron_zondagen.py --bron-root vendor/bron

      - name: Validate VSA content
        run: vsa validate --summary examples/hugo-demo/content-source

      - name: Clean generated static VSA assets
        run: rm -rf examples/hugo-demo/static/vsa

      - name: Generate Hugo preview content and SVG
        run: |
          vsa build-markdown \
            examples/hugo-demo/content-source \
            generated/preview/content \
            examples/hugo-demo/static/vsa \
            --output-mode shortcode

      - name: Generate MXL for Coria links
        run: |
          vsa musicxml \
            examples/hugo-demo/content-source \
            examples/hugo-demo/static/vsa/mxl

      - name: Update navigation placeholders
        run: python scripts/update-nav-placeholders.py generated/preview/content

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo preview
        run: |
          hugo \
            --source examples/hugo-demo \
            --contentDir ../../generated/preview/content \
            --destination ../../generated/preview/site \
            --baseURL "https://orthodox-groningen.github.io/VSA-tooling/preview/"

      - name: Check publication output
        run: |
          python scripts/check-publication-output.py \
            --site-dir generated/preview/site \
            --url-prefix /VSA-tooling/preview/

      - name: Restore published site state
        uses: actions/cache/restore@v4
        id: pages_site_cache
        with:
          path: pages-site
          key: pages-site-${{ github.run_id }}
          restore-keys: |
            pages-site-

      - name: Bootstrap site state from gh-pages branch
        if: steps.pages_site_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-site
        continue-on-error: true

      - name: Prepare site root
        run: mkdir -p pages-site/preview

      - name: Merge preview build
        run: rsync -a --delete generated/preview/site/ pages-site/preview/

      - name: Save published site state
        uses: actions/cache/save@v4
        with:
          path: pages-site
          key: pages-site-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show preview URL
        run: |
          echo "Preview URL: https://orthodox-groningen.github.io/VSA-tooling/preview/"
