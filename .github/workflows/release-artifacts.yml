name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  release-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSA tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build

      - name: Verify version command
        run: |
          vsa --version



      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: |
          python -m pytest


      - name: Install rendering dependencies
        run: python -m pip install -r requirements-rendering.txt

      - name: Build Python package artifacts
        run: |
          python -m build

      - name: Build preview output
        run: |
          vsa validate examples/hugo-demo/content-source
          vsa build-markdown             examples/hugo-demo/content-source             generated/release/content             generated/release/static/vsa

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ inputs.version }}
          path: dist/*

      - name: Upload generated release demo
        uses: actions/upload-artifact@v4
        with:
          name: generated-demo-${{ inputs.version }}
          path: generated/release
