# Release artifacts — handmatig met versienummer (workflow_dispatch).
# Doel: pytest, Python wheel/sdist (dist/), consumer-minimal markdown/SVG artifact.
# Geen Pages-deploy. Lokaal: scripts\test.cmd en python -m build.

name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  release-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-ronl/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Verify version command
        run: |
          vsa --version

      - name: Install rendering fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Python package artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Build consumer-minimal output
        run: |
          vsa validate --summary examples/consumer-minimal/content-source
          vsa build-markdown \
            examples/consumer-minimal/content-source \
            generated/release/content \
            generated/release/static/vsa

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ inputs.version }}
          path: dist/*

      - name: Upload generated release smoke
        uses: actions/upload-artifact@v4
        with:
          name: generated-consumer-minimal-${{ inputs.version }}
          path: generated/release
