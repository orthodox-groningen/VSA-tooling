# VSA CI — Windows-validatie bij elke push/PR.
# Doel: scripts\ci.cmd (pytest, validate + build-markdown op examples/consumer-minimal).
# Geen Hugo-site, geen Pages, geen bron-sync. Lokaal: scripts\ci.cmd

name: VSA CI

on:
  push:
  pull_request:

jobs:
  windows-ci:
    name: Windows tool CI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VSA CI
        shell: cmd
        run: scripts\ci.cmd
