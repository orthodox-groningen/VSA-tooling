# VSA CI — Windows-validatie bij elke push/PR.
# Doel: scripts\check.cmd (pytest, validate + build-markdown op examples/consumer-minimal).
# catalogus komt uit orthodox-ronl/bron (niet de PyPI-naamgenoot). Lokaal: check

name: VSA CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vsa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ci:
    name: Windows tool CI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bron repository
        uses: actions/checkout@v4
        with:
          repository: orthodox-ronl/bron
          path: vendor/bron
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Run VSA CI
        shell: cmd
        run: scripts\ci.cmd
