# TEv2 tools configuration for the VSA-tooling documentation scope.
# Tools draaien vanuit generated/docs (zie scripts/prepare-tev2-docs.py).

scopedir: .
onNotExist: warn
output: .

mrgt:
  vsntag: vsa-tooling

hrgt:
  scopedir: .
  output: .
  interpreter: default
  # Links via {{localize navurl}} (scope-agnostisch; zie TEv2 markdown-table-row).
  # Trailing \n op converter[1] is verplicht: anders plakken abbr/alias-rijen aan
  # dezelfde markdown-tabelregel en verdwijnen ze in de weergave (MkDocs toont 2 cellen).
  converter[1]: "| [{{#if glossaryTerm}}{{noRefs glossaryTerm}}{{else}}{{capFirst term}}{{/if}}]({{localize navurl}}) | {{#if glossaryText}}{{glossaryText}}{{else}}Geen `glossaryText` opgegeven voor deze term.{{/if}}{{#if glossaryNotes}}<br>{{#each glossaryNotes}}{{#if this.heading}}{{#if @first}}**Opmerkingen:**<br>{{else}}<br>{{/if}}- **{{this.heading}}**:{{#each this.items}}<br>&nbsp;&nbsp;- {{this}}{{/each}}{{else}}{{#if @first}}{{#if @last}}**Opmerking**: {{this}}{{else}}**Opmerkingen:**<br>- {{this}}{{/if}}{{else}}<br>- {{this}}{{/if}}{{/if}}{{/each}}{{/if}} |\n"
  converter[2]: "{{#if glossaryAbbr}}| [{{glossaryAbbr}}]({{localize navurl}}) | Afkorting van [{{#if glossaryTerm}}{{glossaryTerm}}{{else}}{{capFirst term}}{{/if}}]({{term}}@). |\n{{else}}{{log level='silent'}}{{/if}}"
  converter[3]: "{{#if glossaryAlias}}| [{{glossaryAlias}}]({{localize navurl}}) | Alias voor [{{#if glossaryTerm}}{{glossaryTerm}}{{else}}{{capFirst term}}{{/if}}]({{term}}@). |\n{{else}}{{log level='silent'}}{{/if}}"
  sorter: "{{noRefs glossaryTerm}}"
  force: true
  input:
    - "glossary.md"

trrt:
  scopedir: .
  output: .
  interpreter: default
  converter: html-hovertext-link
  converter[error]: "{{ref.showtext}}{{log 'TRRT error converter:' err.dir '/' err.file '@' err.line ':' err.pos '[' ref.showtext ']' level='warn'}}"
  force: true
  input:
    - "**/*.md"
