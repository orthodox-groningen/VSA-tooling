terminology:
  scopetag: "vsa"
  scopedir: "https://github.com/orthodox-groningen/VSA-tooling/tree/main/examples/hugo-demo"
  curatedir: "terms"
  glossarydir: "glossaries"
  defaultvsn: "demo"
  defaulttype: "concept"
  website: "http://localhost:1313/"
  navpath: "/terminologie"
  navid: "slug"
  license: "../../LICENSE"
  mappings:
    trrt:
      converters:
        html-hovertext-link: "<a href=\"{{localize entry.navurl}}{{#if ref.trait}}#{{ref.trait}}{{/if}}\" title=\"{{#if entry.hoverText}}{{entry.hoverText}}{{else}}{{#if entry.glossaryTerm}}{{entry.glossaryTerm}}{{else}}{{capFirst entry.term}}{{/if}}: {{noRefs entry.glossaryText type=\"markdown\"}}{{/if}}\">{{ref.showtext}}</a>"
  vsntag: "demo"
  altvsntags:
    - "latest"
scopes: []
entries:
  - slug: "terminologie"
    term: "terminologie"
    termType: "concept"
    glossaryTerm: "Terminologie"
    glossaryText: "een beheerde set termen en definities die binnen deze Hugo-demo eenduidig gebruikt worden."
    formPhrases:
      - "terminologie"
      - "terminologieen"
    scopetag: "vsa"
    locator: "terminologie.md"
    navurl: "http://localhost:1313/terminologie/terminologie"
    headingids:
      - "terminologie"
    termid: "concept:terminologie"
    vsntag: "demo"
  - slug: "toon"
    term: "toon"
    termType: "concept"
    glossaryTerm: "Toon"
    glossaryText: "een melodische modus of toonreeks waarmee liturgische zangstukken worden geordend en gezongen."
    formPhrases:
      - "toon"
      - "tonen"
    scopetag: "vsa"
    locator: "toon.md"
    navurl: "http://localhost:1313/terminologie/toon"
    headingids:
      - "toon"
    termid: "concept:toon"
    vsntag: "demo"
  - slug: "vsa"
    term: "vsa"
    termType: "concept"
    glossaryTerm: "VSA"
    glossaryAbbr: "VSA"
    glossaryText: "de zangnotatie en tooling waarmee liturgische zangteksten in deze repository als bronbestand, rendering en publicatievorm worden beheerd."
    glossaryNotes:
      - "Binnen deze repository verwijst VSA naar de eigen notatie- en publicatieketen, niet naar TEv2 zelf."
    formPhrases:
      - "vsa"
      - "vsa-tooling"
    scopetag: "vsa"
    locator: "vsa.md"
    navurl: "http://localhost:1313/terminologie/vsa"
    headingids:
      - "vsa"
    termid: "concept:vsa"
    vsntag: "demo"
  - slug: "zangstuk"
    term: "zangstuk"
    termType: "concept"
    glossaryTerm: "Zangstuk"
    glossaryText: "een afgebakend gezang of muzikale tekst die als zelfstandig publicatieonderdeel in de Hugo-demo kan worden opgenomen."
    formPhrases:
      - "zangstuk"
      - "zangstukken"
    scopetag: "vsa"
    locator: "zangstuk.md"
    navurl: "http://localhost:1313/terminologie/zangstuk"
    headingids:
      - "zangstuk"
    termid: "concept:zangstuk"
    vsntag: "demo"
