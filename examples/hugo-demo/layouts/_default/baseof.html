<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            line-height: 1.5;
            max-width: 1100px;
        }

        nav {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #cccccc;
        }

        nav a {
            margin-right: 1rem;
        }

        pre {
            background: #f0f0f0;
            padding: 1rem;
            overflow-x: auto;
        }

        code {
            font-family: Consolas, monospace;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 0.5rem;
        }

        .vsa-notation {
            margin-top: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #cccccc;
            padding: 1rem;
        }
    </style>
</head>

<nav>
