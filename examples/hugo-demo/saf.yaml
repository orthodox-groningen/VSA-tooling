scope:
  scopetag: vsa
  scopedir: https://github.com/orthodox-groningen/VSA-tooling/tree/main/examples/hugo-demo
  curatedir: terms
  glossarydir: glossaries
  defaultvsn: demo
  defaulttype: concept
  website: http://localhost:1313/
  navpath: /terminologie
  navid: slug
  license: ../../LICENSE
  mappings:
    trrt:
      converters:
        html-hovertext-link: '<a href="{{localize entry.navurl}}{{#if ref.trait}}#{{ref.trait}}{{/if}}" title="{{#if entry.hoverText}}{{entry.hoverText}}{{else}}{{#if entry.glossaryTerm}}{{entry.glossaryTerm}}{{else}}{{capFirst entry.term}}{{/if}}: {{noRefs entry.glossaryText type="markdown"}}{{/if}}">{{ref.showtext}}</a>'

scopes: []

versions:
  - vsntag: demo
    altvsntags:
      - latest
    termselection:
      - "*"
