site_name: VSA-tooling — documentatie
site_description: Documentatie van de VSA-toolchain (parser, validatie, SVG/MusicXML, hergebruik)
site_url: https://orthodox-groningen.github.io/VSA-tooling/
repo_url: https://github.com/orthodox-groningen/VSA-tooling
repo_name: orthodox-groningen/VSA-tooling
edit_uri: edit/main/docs/

exclude_docs: |
  overrides/**
  history/**
  architecture/**
  mrgs/**
  /README.md
  /status-en-roadmap.md
  /saf.yaml
  /tev2-config.yaml
  /to-do-van-mij.md
  plans/uitgaveprofielen.md

not_in_nav: |
  guides/assets/**
  guides/README.md
  guides/musicxml.md
  guides/testing.md
  guides/quick-start.md
  guides/hugo-workflow.md
  guides/hugo-site-structure.md
  plans/onderzoeks-prompt.md
  reference/cli.md
  terminologie/**

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: info
    anchors: info

theme:
  name: material
  language: nl
  custom_dir: docs/overrides
  favicon: images/favicon.ico
  logo: images/favicon-32x32.png
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - git-revision-date-localized:
      type: date
      locale: nl
      timezone: Europe/Amsterdam
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Starten:
    - Overzicht: getting-started/README.md
  - Handleidingen:
    - Overzicht: manuals/index.md
    - manuals/consumer-site.md
    - guides/user-guide.md
    - guides/cli-taken.md
    - guides/validation.md
    - guides/svg-export.md
    - guides/musicxml-export.md
    - guides/rendering-fonts.md
    - guides/parochie-lokaal-vsa.md
    - guides/testing-and-regression.md
    - guides/liturgikon-notatie.md
    - guides/hugo-navigation-placeholders.md
  - Specificaties:
    - Overzicht: specification/README.md
    - specification/overview.md
    - specification/syntax.md
    - specification/semantics.md
    - specification/validation.md
    - specification/directives.md
    - specification/rendering.md
    - specification/cli.md
    - specification/conformance.md
    - specification/error-handling.md
    - specification/examples.md
    - specification/versioning.md
    - specification/traceability.md
    - specification/open-points.md
  - Referentie:
    - Overzicht: reference/README.md
    - Voorbeelden:
      - Overzicht: reference/voorbeelden/index.md
      - reference/voorbeelden/basis.md
      - reference/voorbeelden/multiline.md
      - reference/voorbeelden/fouten.md
    - reference/fixtures-catalogus.md
    - CLI:
      - Overzicht: reference/cli/index.md
      - reference/cli/validate.md
      - reference/cli/parse.md
      - reference/cli/blocks.md
      - reference/cli/svg.md
      - reference/cli/process.md
      - reference/cli/build-markdown.md
      - reference/cli/resolve-catalogus.md
      - reference/cli/musicxml.md
    - reference/grammar.md
    - reference/tokens.md
    - reference/metadata.md
    - reference/config.md
    - reference/diagnostics.md
    - reference/outputs.md
    - reference/include-vsa.md
    - reference/traceability.md
  - Integratie:
    - Overzicht: integratie/index.md
    - guides/reuse-vsa-tooling.md
    - guides/tev2-docs.md
  - Terminologie:
    - Overzicht: glossary.md
  - Plannen:
    - Overzicht: plans/README.md
    - plans/gebruikseisen-dragers.md
    - plans/docs-content-publiek-en-paginatypen.md
    - plans/vsa-polyphony-proposal.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  preview: false
  build_time: ""
  branch: ""
  social:
    - icon: fontawesome/solid/book-bible
      link: https://orthodox-groningen.github.io/bron/
      name: bron — documentatie
    - icon: fontawesome/solid/code
      link: https://orthodox-groningen.github.io/VSA-tooling/
      name: VSA-tooling — documentatie
    - icon: fontawesome/solid/globe
      link: https://orthodox-groningen.github.io/VSA-demo/
      name: VSA-demo
